<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Booking | Mahardika</title><link rel="stylesheet" href="style.css"></head><body><header class="adminbar"><div class="wrap"><strong>Mahardika Admin</strong><span>Booking Dashboard · Draft</span></div></header><main class="section page"><div class="wrap"><div class="portfolio-note"><div><p class="kicker">DASHBOARD BOOKING</p><h1 class="page-title">Permintaan masuk</h1><span>Prototype dashboard untuk melihat data booking dari form website.</span></div><button class="btn dark" id="clearBookings">Hapus Data</button></div><div id="bookingList" class="booking-list" style="margin-top:25px"></div></div></main><script>const list=document.getElementById('bookingList'),data=JSON.parse(localStorage.getItem('mahardikaBookings')||'[]');if(!data.length){list.innerHTML='<div class="empty">Belum ada booking masuk. Coba isi form booking terlebih dahulu.</div>'}else{list.innerHTML=data.map(b=>`<article class="booking-item"><div><span class="status">${b.status||'Pending'}</span><h3>${b.name}</h3><p>${b.phone} · ${b.date} · ${b.guests||'-'} tamu</p><p><b>${b.service}</b> · ${b.venue||'Lokasi belum diisi'} · ${b.budget||'Budget belum diisi'}</p><small>${b.notes||'Tidak ada catatan'}</small></div><a class="btn dark" href="https://wa.me/6285727732902?text=Halo%20${encodeURIComponent(b.name)},%20terima%20kasih%20atas%20booking%20di%20Mahardika." target="_blank">WhatsApp</a></article>`).join('')}document.getElementById('clearBookings').onclick=()=>{if(confirm('Hapus seluruh data booking?')){localStorage.removeItem('mahardikaBookings');location.reload()}}</script></body></html>
