<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Booking | Mahardika</title><link rel="stylesheet" href="style.css"></head><body>
<header class="site-header"><nav class="nav wrap"><a class="logo" href="index.html"><b>M</b><span>Mahardika<small>Wedding Planner & Studio</small></span></a><div class="links"><a href="index.html">Beranda</a><a href="portfolio.html">Portofolio</a><a href="services.html">Layanan</a><a href="packages.html">Paket</a><a href="contact.html">Kontak</a><a class="pill" href="booking.html">Booking</a></div></nav></header>
<main><section class="page-hero compact"><div class="wrap narrow"><p class="kicker">ADMIN</p><h1>Permintaan<br><i>booking.</i></h1><p class="page-lead">Halaman internal sederhana untuk melihat permintaan booking yang tersimpan di browser.</p></div></section><section class="section-white"><div class="wrap"><div class="admin-head"><h2>Daftar Booking</h2><button id="clearBookings" class="btn outline-dark">Hapus Semua</button></div><div id="bookingList" class="booking-list"></div></div></section></main><footer><div class="wrap foot"><div><strong>Mahardika Wedding Planner & Studio</strong><p>Internal Admin</p></div><div><p>© <span id="year"></span> Mahardika</p></div></div></footer><script src="script.js"></script><script>
const list=document.getElementById('bookingList');const data=JSON.parse(localStorage.getItem('mahardikaBookings')||'[]');
if(!data.length){list.innerHTML='<div class="empty">Belum ada booking masuk.</div>'}else{list.innerHTML=data.map(b=>`<article class="booking-item"><div><span class="status">${b.status||'Pending'}</span><h3>${esc(b.name)}</h3><p>${esc(b.phone)} · ${esc(b.date)} · ${esc(b.guests||'-')} tamu</p><p><b>${esc(b.service)}</b> · ${esc(b.venue||'Lokasi belum diisi')}</p><p>${esc(b.budget||'')}</p><small>${esc(b.notes||'Tidak ada catatan')}</small></div><a class="btn dark" href="https://wa.me/6285727732902?text=${encodeURIComponent('Halo Mahardika, saya ingin menindaklanjuti booking atas nama '+b.name)}" target="_blank">WhatsApp</a></article>`).join('')}
function esc(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}document.getElementById('clearBookings').onclick=()=>{if(confirm('Hapus semua booking?')){localStorage.removeItem('mahardikaBookings');location.reload()}}
</script></body></html>
